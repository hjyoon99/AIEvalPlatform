version: '3.8'

services:
    postgres:
        image: postgres:15-alpine
        container_name: eval_platform_db
        ports:
            - '5433:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: eval_platform
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d eval_platform']
            interval: 2s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
