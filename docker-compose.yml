services:
  postgres:
    image: postgres:15-alpine
    container_name: eval_platform_db
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eval_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eval_platform}',
        ]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock-agent-engine:
    build:
      context: .
      dockerfile: examples/Dockerfile.mock-agent-engine
    ports:
      - '${MOCK_AGENT_ENGINE_PORT:-18000}:18000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-eval_platform}?schema=public
      AGENT_ENGINE_URL: http://mock-agent-engine:18000
      DASHBOARD_URL: http://localhost:${DASHBOARD_PORT:-5173}
      JUDGE_WORKER_ENABLED: 'true'
      JUDGE_WORKER_POLL_INTERVAL_MS: ${JUDGE_WORKER_POLL_INTERVAL_MS:-500}
    depends_on:
      postgres:
        condition: service_healthy
      mock-agent-engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '${DASHBOARD_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock-adapter:
    profiles: ['adapter']
    build:
      context: .
      dockerfile: examples/Dockerfile.mock-adapter
    environment:
      AIEVAL_BASE_URL: http://backend:3000/api/v1
      AIEVAL_SDK_KEY: ${AIEVAL_SDK_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
